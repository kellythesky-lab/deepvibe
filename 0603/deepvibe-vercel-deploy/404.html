<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#F6F4F1"/>
<title>찾으시는 결이 없어요 — deepvibe</title>

<meta name="description" content="이 결은 어디로 흘러갔을까요. 함께 다시 찾아볼 수 있어요."/>
<meta name="robots" content="noindex, nofollow"/>

<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="apple-touch-icon" href="favicon.svg"/>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F4F1;
    --bg-soft:#EFEBE5;
    --ink:#15131A;
    --ink-2:#2a262f;
    --muted:#7a7680;
    --line-04:rgba(20,10,30,.04);
    --line-08:rgba(20,10,30,.08);
    --line-12:rgba(20,10,30,.12);
    --kakao:#FEE500;
    --kakao-ink:#3D1E1E;
    --pink:#ff6f91;
    --pink-soft:#ffb4c6;
    --violet:#b967ff;

    --font-serif:'Fraunces','Noto Serif KR',serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;

    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-out-soft:cubic-bezier(.16,1,.3,1);
    --dur-base:.32s;

    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  :focus{outline:none}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}

  html{scroll-behavior:smooth;overflow-x:hidden;font-size:100%;-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:var(--font-sans);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    word-break:keep-all;line-break:strict;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;flex-direction:column;
  }

  /* ============ NAV ============ */
  nav{
    position:sticky;top:0;z-index:30;
    background:rgba(246,244,241,.85);
    backdrop-filter:blur(14px) saturate(180%);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    border-bottom:.5px solid transparent;
  }
  nav .row{
    max-width:520px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
  }
  nav .logo{display:flex;align-items:center;gap:8px;text-decoration:none}
  nav .logo .mark{display:inline-block;width:22px;height:14px;position:relative}
  nav .logo .mark svg{width:100%;height:100%;overflow:visible}
  nav .logo .word{
    font-family:var(--font-serif);font-weight:400;font-style:italic;
    font-size:18px;letter-spacing:-.01em;color:var(--ink);
  }

  /* ============ MAIN ============ */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    max-width:520px;width:100%;
    margin:0 auto;
    padding:24px 20px calc(40px + var(--safe-bottom));
  }

  .nf-container{
    text-align:center;
    width:100%;
    max-width:420px;
    opacity:0;
    transform:translateY(12px);
    animation:fadeUp .7s .15s var(--ease-out-soft) forwards;
  }
  @keyframes fadeUp{to{opacity:1;transform:none}}

  /* ============ MARK (vesica) ============ */
  .nf-mark{
    display:inline-block;
    position:relative;
    margin-bottom:32px;
  }
  .nf-mark svg{
    width:84px;height:54px;overflow:visible;
    display:block;
  }
  .nf-mark::after{
    content:"";
    position:absolute;inset:-30%;
    background:radial-gradient(circle, rgba(255,159,188,.32), transparent 60%);
    filter:blur(20px);
    z-index:-1;
    pointer-events:none;
  }

  /* ============ HEADING ============ */
  .nf-title{
    font-family:var(--font-serif);font-weight:300;
    font-size:clamp(32px, 9vw, 44px);
    line-height:1.15;letter-spacing:-.025em;
    color:var(--ink);
    margin-bottom:18px;
  }
  .nf-title em{
    font-style:italic;
    color:var(--ink);
  }

  /* ============ BODY ============ */
  .nf-body{
    font-size:15px;
    color:var(--muted);
    line-height:1.7;
    margin-bottom:36px;
    max-width:340px;
    margin-left:auto;margin-right:auto;
  }
  .nf-body em{
    font-style:normal;
    color:var(--ink-2);
    font-weight:500;
    padding:0 4px;
    background:rgba(255,159,188,.2);
    border-radius:4px;
  }

  /* ============ ACTIONS ============ */
  .nf-actions{
    display:flex;flex-direction:column;gap:10px;
    width:100%;
    max-width:280px;
    margin:0 auto;
  }
  .nf-btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;
    padding:14px 18px;
    border-radius:14px;
    font-family:var(--font-sans);
    font-size:14px;font-weight:500;
    letter-spacing:-.005em;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:transform .15s var(--ease-out), background .2s var(--ease-out), color .2s var(--ease-out), border-color .2s var(--ease-out);
  }
  .nf-btn.primary{
    background:var(--ink);
    color:#fff;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 22px -12px rgba(20,10,30,.32);
  }
  .nf-btn.primary:hover{background:var(--ink-2)}
  .nf-btn.primary:active{transform:scale(.98)}
  .nf-btn.secondary{
    background:transparent;
    color:var(--muted);
    border:.5px solid var(--line-12);
  }
  .nf-btn.secondary:hover{
    color:var(--ink);
    border-color:var(--line-12);
    background:var(--bg-soft);
  }
  .nf-btn.secondary:active{transform:scale(.98)}
  .nf-btn svg{flex-shrink:0}

  /* ============ ATTEMPTED PATH (옅게) ============ */
  .nf-attempted{
    margin-top:32px;
    font-family:var(--font-sans);
    font-size:11.5px;
    color:var(--muted-2, #a8a4ac);
    letter-spacing:0;
    word-break:break-all;
    opacity:.6;
  }
  .nf-attempted code{
    font-family:ui-monospace, 'SF Mono', Menlo, monospace;
    font-size:11px;
    background:transparent;
    color:inherit;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:360px){
    main{padding:20px 16px calc(32px + var(--safe-bottom))}
    .nf-mark{margin-bottom:24px}
    .nf-title{font-size:30px}
    .nf-body{font-size:14px;margin-bottom:28px}
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
    .nf-container{opacity:1 !important;transform:none !important}
  }
</style>
</head>
<body>

<!-- =================== NAV =================== -->
<nav id="nav">
  <div class="row">
    <a class="logo" href="/" aria-label="deepvibe 홈으로">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 30 18" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="logo-pink" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff6f91" stop-opacity=".95"/>
              <stop offset="70%" stop-color="#ff9fbc" stop-opacity=".85"/>
              <stop offset="100%" stop-color="#ffb4c6" stop-opacity=".7"/>
            </radialGradient>
            <radialGradient id="logo-violet" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#b967ff" stop-opacity=".95"/>
              <stop offset="70%" stop-color="#cdb4ff" stop-opacity=".85"/>
              <stop offset="100%" stop-color="#cdb4ff" stop-opacity=".7"/>
            </radialGradient>
          </defs>
          <circle cx="11" cy="9" r="8" fill="url(#logo-pink)" style="mix-blend-mode:multiply"/>
          <circle cx="19" cy="9" r="8" fill="url(#logo-violet)" style="mix-blend-mode:multiply"/>
        </svg>
      </span>
      <span class="word">deepvibe</span>
    </a>
    <!-- Auth UI (login button or user chip) is injected by auth-ui.js -->
  </div>
</nav>

<!-- =================== MAIN =================== -->
<main>
  <div class="nf-container">

    <!-- vesica mark (조금 더 큰 사이즈) -->
    <div class="nf-mark" aria-hidden="true">
      <svg viewBox="0 0 84 54" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="nf-pink" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6f91" stop-opacity=".92"/>
            <stop offset="70%" stop-color="#ff9fbc" stop-opacity=".82"/>
            <stop offset="100%" stop-color="#ffb4c6" stop-opacity=".66"/>
          </radialGradient>
          <radialGradient id="nf-violet" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#b967ff" stop-opacity=".92"/>
            <stop offset="70%" stop-color="#cdb4ff" stop-opacity=".82"/>
            <stop offset="100%" stop-color="#cdb4ff" stop-opacity=".66"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="27" r="24" fill="url(#nf-pink)" style="mix-blend-mode:multiply"/>
        <circle cx="52" cy="27" r="24" fill="url(#nf-violet)" style="mix-blend-mode:multiply"/>
      </svg>
    </div>

    <!-- title -->
    <h1 class="nf-title">
      찾으시는 <em>결</em>이<br>
      여기 없어요.
    </h1>

    <!-- body -->
    <p class="nf-body">
      이 페이지는 사라졌거나, 주소가 잘못된 것 같아요.<br>
      <em>다시 시작</em>해 볼까요?
    </p>

    <!-- actions -->
    <div class="nf-actions">
      <a href="/" class="nf-btn primary">
        홈으로 돌아가기
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M5 3 L9 7 L5 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a href="javascript:history.back()" class="nf-btn secondary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M9 3 L5 7 L9 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        이전 페이지로
      </a>
    </div>

    <!-- attempted path (옅게 표시 - 디버그 도움) -->
    <div class="nf-attempted" id="nfAttempted" aria-hidden="true"></div>

  </div>
</main>

<script src="auth.js" defer></script>
<script src="auth-ui.js" defer></script>
<script>
(() => {
  // 사용자가 어떤 URL로 접근했는지 옅게 표시 (디자인 일관성 + 디버그)
  const attempted = document.getElementById('nfAttempted');
  if (attempted) {
    const path = window.location.pathname + window.location.search;
    // 너무 긴 경로는 자름
    const display = path.length > 60 ? path.slice(0, 57) + '...' : path;
    attempted.innerHTML = `요청 경로: <code>${display}</code>`;
  }
})();
</script>
</body>
</html>
